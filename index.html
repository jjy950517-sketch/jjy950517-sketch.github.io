
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 먹지? | 우리 회사 점심 추천</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f8fb;
      color: #222;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }
    header {
      background: white;
      padding: 22px;
      border-bottom: 1px solid #eee;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }
    h1 { font-size: 30px; }
    .intro {
      background: #e9f3ff;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 25px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px #0000000a;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card h2 { font-size: 20px; }
    .card p { color: #666; }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>🍱 오늘 뭐 먹지?</strong>
  </header>

  <main class="container">
    <section class="intro">
      <h1>오늘 점심, 함께 골라요!</h1>
      <p>직원들의 취향과 오늘의 컨디션을 반영해
         점심 메뉴를 추천해 드립니다.</p>
    </section>

    <div class="grid">
      <div class="card" onclick="showLunchPage()">
        <h2>👥 점심 참여하기</h2>
        <p>오늘 함께 점심 먹을 직원 모집</p>
      </div>

      <div class="card" onclick="notice()">
        <h2>❤️ 음식 취향 설정</h2>
        <p>좋아하는 음식과 알레르기 등록</p>
      </div>

      <div class="card" onclick="notice()">
        <h2>✨ 오늘의 메뉴 추천</h2>
        <p>참여 직원들의 취향 기반 추천</p>
      </div>

      <div class="card" onclick="notice()">
        <h2>📍 주변 식당 보기</h2>
        <p>식당 위치와 이동시간 확인</p>
      </div>
    </div>
  </main>

  <script>
    function notice() {
      alert("이 기능은 다음 단계에서 구현할 예정입니다!");
    }
  </script>

<section id="signup-section" style="
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
">
  <h2>🍱 회원가입</h2>

  <p>닉네임과 비밀번호만 입력하세요!</p>

  <form id="signup-form">
    <p>
      <label for="signup-nickname">닉네임  </label>
      <input
        id="signup-nickname"
        type="text"
        minlength="2"
        maxlength="20"
        required
      >
    </p>

    <p>
      <label for="signup-password">비밀번호</label>
      <input
        id="signup-password"
        type="password"
        minlength="6"
        required
      >
    </p>

    <button type="submit">회원가입</button>
  </form>

  <p id="signup-message"></p>
</section>

<script>
  document.getElementById("signup-form")
    .addEventListener("submit", async function (event) {
      event.preventDefault();

      const nickname = document
        .getElementById("signup-nickname").value.trim();

      const password = document
        .getElementById("signup-password").value;

      const message = document
        .getElementById("signup-message");

      message.textContent = "회원가입 처리 중...";

      const button = this.querySelector("button");
      button.disabled = true;

      try {
        const { data, error } =
          await supabaseClient.functions.invoke(
            "register-user",
            {
              body: { nickname, password }
            }
          );

        if (error) {
          message.textContent =
            data?.error || error.message ||
            "회원가입에 실패했습니다.";
        } else if (data?.error) {
          message.textContent = data.error;
        } else {
          message.textContent =
            "🎉 회원가입이 완료되었습니다!";
          this.reset();
        }
      } catch (error) {
        message.textContent =
          "오류가 발생했습니다: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
</script>

<!-- 점심 참여 화면 -->
<section id="lunch-page" style="
  display:none;
  max-width:600px;
  margin:30px auto;
  padding:24px;
  background:white;
  border-radius:18px;
">
  <h2>🍱 오늘 점심 참여하기</h2>

  <h3 id="lunch-count">오늘 밥 먹는 인원: 0명</h3>
  <p id="lunch-members">아직 참여자가 없습니다.</p>

  <label for="lunch-nickname">닉네임</label>
  <input id="lunch-nickname"
    placeholder="닉네임을 입력하세요">

  <h3>오늘의 상태</h3>
  <p>여러 개 선택할 수 있어요!</p>

  <div id="lunch-conditions"></div>

  <p>
    <button onclick="joinLunch()">
      🙋 점심 참여하기
    </button>
    <button onclick="cancelLunch()">
      참여 취소
    </button>
  </p>
  <p id="lunch-message"></p>
</section>

<script>
  const lunchOptions = [
    ["normal", "😊 아무거나 좋아요"],
    ["soup", "🍲 국물이 당겨요"],
    ["hangover", "🥴 해장이 필요해요"],
    ["light", "🥗 가볍게 먹고 싶어요"],
    ["hearty", "🍖 든든하게 먹고 싶어요"],
    ["spicy", "🌶️ 매운 음식이 당겨요"],
    ["rice", "🍚 밥이 먹고 싶어요"],
    ["noodle", "🍜 면이 당겨요"],
    ["quick", "⚡ 빨리 먹고 싶어요"],
    ["new", "✨ 새로운 음식에 도전!"]
  ];

  const lunchParticipants = new Map();

  document.getElementById("lunch-conditions").innerHTML =
    lunchOptions.map(([id, label]) => `
      <label style="
        display:block;
        padding:10px;
        margin:6px 0;
        border:1px solid #ddd;
        border-radius:10px;
        cursor:pointer;
      ">
        <input type="checkbox"
          name="lunch-condition"
          value="${id}"
          ${id === "normal" ? "checked" : ""}>
        ${label}
      </label>
    `).join("");

  document.querySelectorAll(
    'input[name="lunch-condition"]'
  ).forEach(input => {
    input.addEventListener("change", () => {
      const boxes = [...document.querySelectorAll(
        'input[name="lunch-condition"]'
      )];

      const normal = boxes.find(x => x.value === "normal");

      if (input.value === "normal" && input.checked) {
        boxes.forEach(x => {
          if (x !== normal) x.checked = false;
        });
      } else if (input.checked) {
        normal.checked = false;
      }

      if (!boxes.some(x => x.checked)) {
        normal.checked = true;
      }
    });
  });

  function showLunchPage() {
    document.getElementById("lunch-page")
      .style.display = "block";

    document.getElementById("lunch-page")
      .scrollIntoView({ behavior: "smooth" });
  }

  function updateLunchList() {
    const names = [...lunchParticipants.keys()];

    document.getElementById("lunch-count")
      .textContent =
        `오늘 밥 먹는 인원: ${names.length}명`;

    document.getElementById("lunch-members")
      .textContent = names.length
        ? "참여자: " + names.join(", ")
        : "아직 참여자가 없습니다.";
  }

  function joinLunch() {
    const nickname = document.getElementById(
      "lunch-nickname"
    ).value.trim();

    if (!nickname) {
      alert("닉네임을 입력해 주세요.");
      return;
    }

    const selected = [...document.querySelectorAll(
      'input[name="lunch-condition"]:checked'
    )].map(x => x.value);

    lunchParticipants.set(nickname, selected);
    updateLunchList();

    document.getElementById("lunch-message")
      .textContent =
        `${nickname}님이 점심에 참여했습니다! 🎉`;
  }

  function cancelLunch() {
    const nickname = document.getElementById(
      "lunch-nickname"
    ).value.trim();

    if (!lunchParticipants.has(nickname)) {
      alert("참여 중인 닉네임을 입력해 주세요.");
      return;
    }

    lunchParticipants.delete(nickname);
    updateLunchList();

    document.getElementById("lunch-message")
      .textContent = "참여가 취소되었습니다.";
  }
</script>

<style>
  /* 오늘의 상태: 2열 배치 */
  #lunch-conditions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 16px 0;
  }

  /* 선택 항목 디자인 */
  #lunch-conditions label {
    display: flex !important;
    align-items: center;
    gap: 8px;
    min-height: 55px;
    padding: 12px !important;
    margin: 0 !important;
    border: 2px solid #e5e7eb !important;
    border-radius: 12px !important;
    background: #f8fafc;
    font-size: 14px;
    box-sizing: border-box;
  }

  /* 선택된 항목 강조 */
  #lunch-conditions label:has(input:checked) {
    background: #e0f2fe;
    border-color: #38bdf8 !important;
    font-weight: bold;
  }

  #lunch-conditions input {
    accent-color: #0284c7;
    flex-shrink: 0;
  }

  /* 작은 화면에서도 글자가 잘 보이도록 */
  @media (max-width: 380px) {
    #lunch-conditions {
      grid-template-columns: 1fr;
    }
  }
</style>

</body>
</html>
