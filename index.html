
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 뭐 먹지? | 우리 회사 점심 추천</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f8fb;
      color: #222;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }
    header {
      background: white;
      padding: 22px;
      border-bottom: 1px solid #eee;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }
    h1 { font-size: 30px; }
    .intro {
      background: #e9f3ff;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 25px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px #0000000a;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card h2 { font-size: 20px; }
    .card p { color: #666; }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>🍱 오늘 뭐 먹지?</strong>
  </header>

  <main class="container">
    <section class="intro">
      <h1>오늘 점심, 함께 골라요!</h1>
      <p>직원들의 취향과 오늘의 컨디션을 반영해
         점심 메뉴를 추천해 드립니다.</p>
    </section>

    <div class="grid">
      <div class="card" onclick="notice()">
        <h2>👥 점심 참여하기</h2>
        <p>오늘 함께 점심 먹을 직원 모집</p>
      </div>

      <div class="card" onclick="notice()">
        <h2>❤️ 음식 취향 설정</h2>
        <p>좋아하는 음식과 알레르기 등록</p>
      </div>

      <div class="card" onclick="notice()">
        <h2>✨ 오늘의 메뉴 추천</h2>
        <p>참여 직원들의 취향 기반 추천</p>
      </div>

      <div class="card" onclick="notice()">
        <h2>📍 주변 식당 보기</h2>
        <p>식당 위치와 이동시간 확인</p>
      </div>
    </div>
  </main>

  <script>
    function notice() {
      alert("이 기능은 다음 단계에서 구현할 예정입니다!");
    }
  </script>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Supabase 프로젝트 주소
  const SUPABASE_URL =
    "https://txncnlqvxcowzpasecy.supabase.co";

  // 복사해 둔 Publishable key 입력
  const SUPABASE_KEY = "sb_publishable_KB2qK1_Iclu1n5zZwUExxQ_muOJpTnm";

  // Supabase 연결 객체 생성
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function testConnection() {
    try {
      const { error } = await supabaseClient.auth.getSession();

      if (error) {
        alert("Supabase 확인 실패: " + error.message);
      } else {
        alert("Supabase 클라이언트가 정상적으로 초기화되었습니다!");
      }
    } catch (error) {
      alert("연결 오류: " + error.message);
    }
  }
</script>

<button onclick="testConnection()">
  🔗 Supabase 연결 확인
</button>

<section id="signup-section" style="
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
">
  <h2>🍱 회원가입</h2>

  <p>닉네임과 비밀번호만 입력하세요!</p>

  <form id="signup-form">
    <p>
      <label for="signup-nickname">닉네임</label>
      <input
        id="signup-nickname"
        type="text"
        minlength="2"
        maxlength="20"
        required
      >
    </p>

    <p>
      <label for="signup-password">비밀번호</label>
      <input
        id="signup-password"
        type="password"
        minlength="6"
        required
      >
    </p>

    <button type="submit">회원가입</button>
  </form>

  <p id="signup-message"></p>
</section>

<script>
  document.getElementById("signup-form")
    .addEventListener("submit", async function (event) {
      event.preventDefault();

      const nickname = document
        .getElementById("signup-nickname").value.trim();

      const password = document
        .getElementById("signup-password").value;

      const message = document
        .getElementById("signup-message");

      message.textContent = "회원가입 처리 중...";

      const button = this.querySelector("button");
      button.disabled = true;

      try {
        const { data, error } =
          await supabaseClient.functions.invoke(
            "register-user",
            {
              body: { nickname, password }
            }
          );

        if (error) {
          message.textContent =
            data?.error || error.message ||
            "회원가입에 실패했습니다.";
        } else if (data?.error) {
          message.textContent = data.error;
        } else {
          message.textContent =
            "🎉 회원가입이 완료되었습니다!";
          this.reset();
        }
      } catch (error) {
        message.textContent =
          "오류가 발생했습니다: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
</script>

</body>
</html>
